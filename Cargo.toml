[package]
name = "openlimits"
version = "0.3.1-alpha.0"
authors = ["steffel <2143646+steffenix@users.noreply.github.com>", "Ethan Fast <ethan@nash.io>", "Danilo Guanabara <danilo@nash.io>"]
edition = "2018"
description = "A open source Rust high performance cryptocurrency trading API with support for multiple exchanges and language wrappers. Focused in safety, correctness and speed."
license = "BSD-2-Clause"
repository = "https://github.com/nash-io/openlimits"
keywords = ["cryptocurrency", "exchange", "openlimits", "api"]

[[example]]
name = "orderbook"
path = "examples/rust/orderbook.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# bindings = ["ligen", "ligen-macro", "ligen-csharp"]
default = ["rust_gmp"]
rust_gmp = ["openlimits-nash/rust_gmp"]
num_bigint = ["openlimits-nash/num_bigint"]

[dependencies]
openlimits-binance  = { version = "0.3.1-alpha.0", path = "crates/openlimits-binance" }
openlimits-exchange = { version = "0.3.1-alpha.0", path = "crates/openlimits-exchange" }
openlimits-coinbase = { version = "0.3.1-alpha.0", path = "crates/openlimits-coinbase" }
openlimits-nash = { version = "0.3.1-alpha.0", path = "crates/openlimits-nash" }
# ligen-macro = { path = "../../sensorial/systems/ligen/ligen/macro", optional = true }
# ligen        = { path = "../../sensorial/systems/ligen/ligen", optional = true }
# lazy_static = "1.4.0"

[dev-dependencies]
rust_decimal = "1.14.3"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
dotenv = "0.15.0"

[build-dependencies]
# ligen        = { path = "../../sensorial/systems/ligen/ligen", optional = true }
# ligen-csharp = { path = "../../sensorial/systems/ligen/generators/ligen-csharp", optional = true }

[workspace]
resolver = "2"
members = ["crates/cross-async", "crates/openlimits-messaging", "crates/openlimits-binance", "crates/openlimits-nash", "crates/openlimits-coinbase", "crates/openlimits-exchange"]
exclude = ["crates/openlimits-huobi"]

[patch.crates-io]
nash-protocol = { path = "vendor/nash-protocol" }
nash-native-client = { path = "vendor/nash-native-client" }
